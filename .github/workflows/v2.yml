name: v2

on:
  push:
    branches: [next2]
  pull_request:
    branches: [next2]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    name: v2 PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generated tables are current
        run: composer v2-tables-check

      - name: Run tests
        run: composer v2-test

      - name: Writer gates on generated inputs
        run: |
          php v2/scripts/writer-gates.php tokens 3
          php v2/scripts/writer-gates.php lines 2
          php v2/scripts/writer-gates.php random 20000 1

      - name: Check pinned oracle corpus and clause exceptions
        run: python3 v2/oracle/verify_corpus.py

      # Dom\HTMLDocument and grapheme_str_split exist from PHP 8.4; 8.2 runs the fallbacks in the tests above.
      - name: Run PHPStan
        if: matrix.php == '8.5'
        run: composer v2-stan

      - name: Check coding standards
        run: composer v2-cs-check
