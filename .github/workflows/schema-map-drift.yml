name: Schema map drift

# Compares the vendored ProseMirror map with carve-grammars `main`, which moves
# on its own schedule. Upstream moving is not a failure of a pull request here,
# so this runs daily and files one tracking issue instead (markup-carve/carve#2706).
# The provenance block's own shape is asserted by SchemaMapProvenanceTest on
# every pull request.

on:
  schedule:
    # 05:30 UTC, after guards.yml at 04:15.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schema-map-drift-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  schema-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: ProseMirror schema map matches carve-grammars

    steps:
      - uses: actions/checkout@v6

      # Full history: the check asks which commits touched the map since the one
      # recorded, and whether that one is an ancestor of `main`.
      - uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-grammars
          path: .carve-grammars
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check the schema map against its provenance commit
        id: measure
        run: |
          set -o pipefail
          composer schema-map-check -- --grammars .carve-grammars --github 2>&1 \
            | tee /tmp/schema-map-drift.txt && status=0 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '## Schema map drift'
            echo
            echo '```text'
            cat /tmp/schema-map-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Same reporter as markup-carve/carve changelog-drift.yml: one issue,
      # edited by each red run, closed by the first green one.
      - name: File the verdict where someone reads it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ steps.measure.outputs.status }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Schema map drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="The vendored ProseMirror schema map has drifted from carve-grammars"
          MARKER="<!-- schema-map-drift-verdict ref=$REF_NAME -->"

          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if [ "${STATUS:-1}" = "0" ]; then
            echo "The schema map agrees with carve-grammars on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Green again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next red run opens a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "\`composer schema-map-check\` is failing: \`resources/prosemirror-schema-map.json\`"
            echo "no longer agrees with carve-grammars \`tiptap/schema-map.json\` at its recorded"
            echo "provenance commit or on carve-grammars \`main\`."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### What it reported"
            echo
            echo '```text'
            cat /tmp/schema-map-drift.txt
            echo '```'
            echo
            echo "### How to clear it"
            echo
            echo "Refresh the vendored copy from carve-grammars and bump \`_provenance.commit\`,"
            echo "or declare each intended difference in \`_provenance.divergences\`. Reproduce"
            echo "locally with \`composer schema-map-check -- --grammars <carve-grammars checkout>\`."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later red run and CLOSED by the first green one. Closing it by hand does"
            echo "not silence it: the next red run files a new one."
          } > /tmp/schema-map-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/schema-map-drift-verdict.md
            echo "Updated #$issue."
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --label chore --label area:tooling \
              --body-file /tmp/schema-map-drift-verdict.md)"
            echo "Filed $url."
          fi
