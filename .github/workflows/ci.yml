name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Reject spec pins that are not reachable from spec main (carve#1740).
  # Fleet pin currency is checked separately by the spec repository at tag time.
  spec-pin:
    runs-on: ubuntu-latest
    name: spec pin is reachable from spec main

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The checkout above is shallow (no fetch-depth), so the script deepens
      # the submodule before asking - see the comment in it for why a depth-1
      # clone cannot answer the ancestry question either way.
      - name: Spec pin ancestry
        run: ./scripts/check-spec-pin-ancestry.sh tests/spec

  # Compare the vendored map with its provenance commit. Local differences
  # must be declared in _provenance.divergences; stale declarations are refused
  # (carve-php#2326).
  schema-map:
    runs-on: ubuntu-latest
    name: ProseMirror schema map matches carve-grammars

    steps:
      - uses: actions/checkout@v6

      # Full history: the check asks which commits touched the map since the one
      # recorded, and whether that one is an ancestor of `main`. A depth-1 clone
      # answers neither.
      - uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-grammars
          path: .carve-grammars
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check the schema map against its provenance commit
        run: composer schema-map-check -- --grammars .carve-grammars --github

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Run tests in parallel. Include-conformance tests require the spec
      # submodule checked out above.
      - name: Run tests
        run: composer test-parallel

  tooling:
    runs-on: ubuntu-latest
    name: Coding Standards

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

      - name: Run PHP CS Fixer
        run: composer cs-check
