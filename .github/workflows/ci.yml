name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PARALLEL. PHPUnit runs one process and 512 test files one after
      # another; paratest schedules them across the runner's cores. The
      # sequential `composer test` stays the local default - a single process
      # gives a clearer failure, and this is a CI trade, not a repo-wide one.
      - name: Run tests
        run: composer test-parallel

  scaling:
    runs-on: ubuntu-latest
    name: Scaling Guards

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Excluded from the default suite (see phpunit.xml.dist): they convert a
      # 50000-repeat input several times per data set and measure wall clock, so
      # they need a runner to themselves rather than a slot in the test matrix.
      - name: Run scaling guards
        run: composer test-scaling

  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # This job sets the whole run's wall clock (5m20s of a 5m44s run), so it
      # is the leg the parallel run has to reach to be worth anything. pcov
      # collects per process and paratest merges the reports.
      - name: Run tests with coverage
        run: composer test-coverage-parallel

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  tooling:
    runs-on: ubuntu-latest
    name: Coding Standards

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

      - name: Run PHP CS Fixer
        run: composer cs-check
