name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # THE PIN RESOLVES BY SHA, SO NOTHING ELSE HERE CAN SEE A DANGLING ONE. Every
  # other job checks the spec submodule out and runs against whatever tree the
  # pin names, which works just as well for a commit that is not on spec `main`
  # as for one that is - right up until the commit is collected and the checkout
  # itself starts failing (markup-carve/carve#1740). Seconds, and it needs no
  # PHP, so it runs alongside everything else on every PR.
  #
  # REACHABLE IS ALL IT MEANS, which is why the job is named for that and not
  # for currency. A commit five hundred behind is reachable too, so a green run
  # here says nothing about which spec this engine implements. Whether the three
  # engines pin the SAME commit is the spec repo's
  # scripts/fleet-spec-pin-check.mjs, run from pre-tag-check.sh at tag time.
  spec-pin:
    runs-on: ubuntu-latest
    name: spec pin is reachable from spec main

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The checkout above is shallow (no fetch-depth), so the script deepens
      # the submodule before asking - see the comment in it for why a depth-1
      # clone cannot answer the ancestry question either way.
      - name: Spec pin ancestry
        run: ./scripts/check-spec-pin-ancestry.sh tests/spec

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PARALLEL. PHPUnit runs one process and 512 test files one after
      # another; paratest schedules them across the runner's cores. The
      # sequential `composer test` stays the local default - a single process
      # gives a clearer failure, and this is a CI trade, not a repo-wide one.
      #
      # Runs the full PHPUnit suite, which includes the cross-engine
      # include-conformance GATE (tests/TestCase/Transform/IncludeConformanceTest.php).
      # That gate reads the vendored vectors under tests/spec/tests/include-conformance/,
      # so `submodules: recursive` above is REQUIRED - without it the runner fails
      # loudly rather than skipping.
      - name: Run tests
        run: composer test-parallel

  tooling:
    runs-on: ubuntu-latest
    name: Coding Standards

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

      - name: Run PHP CS Fixer
        run: composer cs-check
