name: CI

on:
  push:
    branches: [main, next2]
  pull_request:
    branches: [main, next2]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import-lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-progress
      - name: Run import tests
        run: vendor/bin/phpunit tests/Import

  # The libxml fallback on libxml below 2.14 (HTML4 parser), as Debian 12 and Ubuntu 24.04 ship it; the runners have 2.14+.
  import-old-libxml:
    runs-on: ubuntu-latest
    container: php:8.5-cli
    timeout-minutes: 20
    steps:
      # Without git the checkout downloads the archive, which leaves out the export-ignored tests.
      - name: Install git and unzip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip git
      - uses: actions/checkout@v6
      - name: Install composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: The image still has the HTML4 parser
        run: |
          php -r '$d = new DOMDocument(); @$d->loadHTML("<p>a<wbr>b</p>"); if ($d->getElementsByTagName("wbr")->item(0)->childNodes->length === 0) { fwrite(STDERR, "this image has libxml 2.14 or later: pin an older one\n"); exit(1); } echo "libxml ", LIBXML_DOTTED_VERSION, PHP_EOL;'
      - name: Run import tests
        run: php -d memory_limit=1G vendor/bin/phpunit tests/Import tests/Conformance/ImportClauseCasesTest.php

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generated tables are current
        run: composer tables-check

      - name: Run tests
        run: composer test

      - name: Fuzz smoke (crash, hang, memory and time properties)
        if: matrix.php == '8.5'
        timeout-minutes: 10
        run: composer fuzz -- smoke

      - name: Install into a scratch consumer and call every public entry
        if: matrix.php == '8.2'
        run: scripts/consumer-smoke.sh

      - name: Writer gates on generated inputs (held for candidate 12)
        if: false
        run: |
          php scripts/writer-gates.php tokens 3
          php scripts/writer-gates.php lines 2
          php scripts/writer-gates.php random 20000 1

      - name: Check older JS differential corpus (held for candidate 12)
        if: false
        run: python3 oracle/verify_corpus.py

      # Dom\HTMLDocument and grapheme_str_split exist from PHP 8.4; 8.2 runs the fallbacks in the tests above.
      - name: Run PHPStan
        if: matrix.php == '8.5'
        run: composer stan

      - name: Check coding standards
        run: composer cs-check
