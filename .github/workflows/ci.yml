name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRs cancel their own superseded runs; every other event gets a unique group,
# because GitHub keeps only one pending run per group and would drop main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  # Reject spec pins that are not reachable from spec main (carve#1740).
  # Fleet pin currency is checked separately by the spec repository at tag time.
  spec-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: spec pin is reachable from spec main

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The checkout above is shallow (no fetch-depth), so the script deepens
      # the submodule before asking - see the comment in it for why a depth-1
      # clone cannot answer the ancestry question either way.
      - name: Spec pin ancestry
        run: ./scripts/check-spec-pin-ancestry.sh tests/spec

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Maintainer decision: PRs run only the supported min and max PHP;
      # pushes to main run the full range.
      matrix:
        php: ${{ github.event_name == 'pull_request' && fromJSON('["8.2", "8.5"]') || fromJSON('["8.2", "8.3", "8.4", "8.5"]') }}

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Run tests in parallel. Include-conformance tests require the spec
      # submodule checked out above.
      - name: Run tests
        run: composer test-parallel

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Coding Standards

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

      - name: Run PHP CS Fixer
        run: composer cs-check
