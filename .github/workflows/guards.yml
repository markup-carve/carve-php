name: Guards

# THE TWO LONGEST JOBS IN THIS REPOSITORY, NEITHER OF WHICH A REVIEW READS.
# Measured over the 30 days to 2026-09-22, 135 pull-request runs, per-step
# timings from run 35684958449:
#
#   | job              | the step that costs |        |
#   | ---------------- | ------------------- | ------ |
#   | Code Coverage    | test-coverage-parallel | 5m54s |
#   | Scaling Guards   | test-scaling           | 3m36s |
#   | PHP 8.5          | test-parallel          | 1m33s |
#   | PHP 8.2          | test-parallel          | 1m27s |
#   | Coding Standards | stan + cs-check        |   36s |
#
# CI averaged 6m37s of wall clock and coverage set it on every run, so a review
# waited about five extra minutes for two numbers it does not act on: a coverage
# delta, and wall-clock ratios over a 50000-repeat input. Neither is a merge
# decision, and the second is the least trustworthy thing to measure on a shared
# runner beside five other jobs.
#
# `composer install` is NOT what to optimize here and was checked before this
# change: it is 4 to 5 seconds in every job, so caching the vendor tree would
# buy nothing. The cost is test EXECUTION.
#
# Where they run now: every push to main, nightly at 04:15 UTC, and on demand.
# The push trigger is what keeps them guards - a merge that slows the parser or
# drops coverage goes red within one run, and the run names that merge, which a
# pull-request check could not do for a branch that never lands. Codecov keeps
# receiving main, so the project trend is unbroken; what stops is the per-pull-
# request patch status.
#
# To measure a branch before it merges:
#   gh workflow run guards.yml -R markup-carve/carve-php --ref <branch>
# A performance or coverage pull request should do exactly that.
#
# `Code Coverage` and `Scaling Guards` were required status checks on `main`
# until this file existed. Both were removed from that list in the same change:
# a required check that no pull request can ever report is a branch nothing can
# merge into.

on:
  push:
    branches: [main]
  schedule:
    # 04:15 UTC, ahead of the 05:00 drift jobs elsewhere in the org.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      verdict_selftest:
        description: 'Run the escalation path against a synthetic failure and file nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guards-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  scaling:
    runs-on: ubuntu-latest
    name: Scaling Guards
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Excluded from the default suite (see phpunit.xml.dist): they convert a
      # 50000-repeat input several times per data set and measure wall clock, so
      # they need a runner to themselves rather than a slot in the test matrix.
      - name: Run scaling guards
        run: composer test-scaling

  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # PHP 8.5 resolves PHPUnit 13, whose coverage files are a tenth the size
      # of PHPUnit 12's. On 8.3 paratest's merge of them peaked at 14.9 GB on a
      # 16 GB runner, and the runner killed the job with exit 143 (#2156).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # pcov collects per process and paratest merges the reports.
      - name: Run tests with coverage
        run: composer test-coverage-parallel

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # NEITHER JOB ABOVE GATES A PULL REQUEST ANY MORE, so their result has to
  # reach a person by itself. Without this the change would buy five minutes of
  # review time and spend it on two guards going red into an Actions tab nobody
  # opens, which is how a check stops being one.
  #
  # Same shape as the verdict step in markup-carve/carve's ast-conformance
  # workflow: ONE tracking issue, EDITED by each later red run and CLOSED by the
  # first green one, matched on a body marker rather than on a title so a rename
  # cannot fork it into two. The failing steps are read back from the run rather
  # than listed here, so a step added later cannot fail invisibly.
  verdict:
    name: The verdict reaches a person
    runs-on: ubuntu-latest
    needs: [scaling, coverage]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.verdict_selftest) }}
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: File the verdict where someone reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          MARKER="<!-- guards-verdict ref=$REF_NAME -->"

          # Every call here shares one failure mode with the thing it reports:
          # a transient GraphQL or REST error used to abort the step under
          # `set -e`, so a red run escalated NOTHING and looked exactly like a
          # green one from outside (#2452). Two defenses, and the second is the
          # one that matters: retry, then fall back to a channel that does not
          # touch the issues API at all.
          try() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt $attempt failed: $*" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # Read back which steps failed, rather than trusting the needs
          # contexts: "one job failed" and "which measurement moved" are
          # different facts, and only the second is actionable.
          jobs_json=/tmp/guards-jobs.json
          if ! try gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate > "$jobs_json"; then
            # Without the job list there is no verdict to compute, so say that
            # rather than exiting 0 on an empty `failed`.
            echo "::error::Could not read the job list for run $RUN_ID; the guard verdict is UNKNOWN, not green."
            {
              echo "## The guard verdict is UNKNOWN"
              echo
              echo "Reading the job list for [run $RUN_ID]($RUN_URL) failed three times, so this"
              echo "run reports neither green nor red. Treat \`$HEAD_SHA\` as unverified and"
              echo "re-run the workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          failed="$(jq -r '.jobs[] | select(.name != "The verdict reaches a person") | .steps[]
                  | select(.conclusion == "failure") | "- `" + .name + "`"' "$jobs_json")"
          bad_jobs="$(jq -r '.jobs[] | select(.name != "The verdict reaches a person")
                  | select(.conclusion == "timed_out" or .conclusion == "cancelled")
                  | "- `" + .name + "` (" + .conclusion + ")"' "$jobs_json")"
          failed="${failed}${failed:+$'\n'}${bad_jobs}"

          # A notifier nobody has watched succeed is the same class as a check
          # nobody has watched fail, so the escalation path is runnable on
          # demand against a synthetic failure. It files nothing.
          SELFTEST="${{ inputs.verdict_selftest && 'true' || 'false' }}"
          if [ "$SELFTEST" = 'true' ]; then
            failed="- \`synthetic failure (verdict_selftest)\`"
          fi

          # Listed rather than searched: the search index lags a fresh issue by
          # long enough to file a duplicate.
          issue=''
          if try gh api "repos/$REPO/issues?state=open&per_page=100" --paginate > /tmp/guards-issues.json; then
            issue="$(jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number' \
                /tmp/guards-issues.json | head -n1)"
          else
            echo "::warning::Could not list open issues; will file a fresh ticket rather than editing one."
          fi

          if [ -z "$failed" ]; then
            echo "Both guards are green on $HEAD_SHA."
            echo "Guards green on \`$HEAD_SHA\`. Nothing filed." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              if try gh issue comment "$issue" --repo "$REPO" --body \
                   "Green again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next red run files a fresh ticket rather than reopening this one, so a closed ticket always means the last run passed." \
                 && try gh issue close "$issue" --repo "$REPO"; then
                echo "Closed #$issue."
              else
                # Leaving it open is the safe direction, but it must not read as
                # a guard that is still red.
                echo "::error::Guards are green but #$issue could not be closed; close it by hand."
                echo "Guards are GREEN on \`$HEAD_SHA\`, but closing #$issue failed. Close it by hand." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "A guard is failing on \`$REF_NAME\`. These jobs do not run on pull"
            echo "requests, so a branch can show a green CI run while this is red."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### Failing steps"
            echo
            printf '%s\n' "$failed"
            echo
            echo "### Before acting on this"
            echo
            echo "\`Run scaling guards\` measures process CPU time over a 50000-repeat input, so"
            echo "read the reported ratio rather than an absolute time, and reproduce with"
            echo "\`CARVE_SCALING_REPORT=1 composer test-scaling\` on an idle machine before"
            echo "concluding the parser got slower. A ratio near its threshold on one run is not"
            echo "yet a regression: the same code has measured 2.3x on a shared runner and 1.1x"
            echo "idle, because the large sample leaves cache where the small one fits."
            echo
            echo "\`Run tests with coverage\` failing is usually not a coverage number at all:"
            echo "paratest merging pcov reports has run a 16 GB runner out of memory before"
            echo "(exit 143, #2156), which is why this leg is pinned to PHP 8.5."
            echo
            echo "To measure a candidate fix before it merges:"
            echo "\`gh workflow run guards.yml -R $REPO --ref <branch>\`."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later red run and CLOSED by the first green one. Closing it by hand does"
            echo "not silence it: the next red run files a new one."
          } > /tmp/guards-verdict.md

          # The verdict reaches the run BEFORE it is sent to the issues API. This
          # is the channel that does not share a failure mode with the tickets,
          # so an API outage downgrades the escalation instead of erasing it.
          {
            echo "## A guard is failing on \`$REF_NAME\`"
            echo
            cat /tmp/guards-verdict.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SELFTEST" = 'true' ]; then
            echo "::notice::Self-test: the verdict above was produced from a synthetic failure. Nothing was filed."
            echo "_Self-test run: nothing was filed._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Filing SUCCEEDS the step: the guard jobs above are already red, and a
          # green verdict job is what tells the three outcomes apart - nothing to
          # notify, notified, and could not notify.
          if [ -n "$issue" ]; then
            if try gh issue edit "$issue" --repo "$REPO" --body-file /tmp/guards-verdict.md; then
              echo "Updated #$issue."
              exit 0
            fi
          else
            if url="$(try gh issue create --repo "$REPO" \
                --title "A guard is failing on $REF_NAME" \
                --label bug --label area:tooling \
                --body-file /tmp/guards-verdict.md)"; then
              echo "Filed $url."
              exit 0
            fi
          fi

          # Reached only when every attempt to write the ticket failed. The
          # verdict is already in the step summary above, so this says which of
          # the two things went wrong rather than leaving one silence to cover
          # both.
          echo "::error::A guard is failing on $HEAD_SHA AND the ticket could not be written. The verdict is in this run's summary."
          echo "**The escalation itself failed.** The verdict above never reached a ticket." >> "$GITHUB_STEP_SUMMARY"
          exit 1
